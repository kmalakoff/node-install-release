name: CI
on:
  push:
    branches:
      - master
jobs:
  test:
    name: Node.js ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        # os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: git config --global user.name "Github Actions"
      - run: git config --global user.email "actions@users.noreply.github.com"
      - run: npm ci
      - run: npm run prepublishOnly
      - run: npm run test
      - run: npm run test:engines
      # libatomic: nodejs.org's linux-x64-musl binaries link it and node:alpine does not ship it
      - name: test on alpine (musl)
        if: runner.os == 'Linux'
        run: docker run --rm -v "$PWD":/w -v /w/node_modules -w /w node:26-alpine sh -c "apk add --no-cache git libatomic && npm ci && npm test"
